<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 8 Years. 1 Heart. Infinite Love.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(180deg,#050d1d,#0b1e44,#16366f);

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

.loading{

position:absolute;

width:100%;

height:100%;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

animation:fadeOut 5s forwards;

animation-delay:3s;

background:#050d1d;

z-index:999;

}

.bar{

width:260px;

height:18px;

background:#23385d;

border-radius:50px;

overflow:hidden;

margin-top:20px;

}

.progress{

height:100%;

width:0;

background:#ff5d91;

animation:load 3s forwards;

}

@keyframes load{

to{

width:100%;

}

}

@keyframes fadeOut{

to{

opacity:0;

visibility:hidden;

}

}

.container{

opacity:0;

animation:showPage 2s forwards;

animation-delay:4s;

text-align:center;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

padding:40px;

border-radius:30px;

width:90%;

max-width:700px;

box-shadow:0 0 35px rgba(255,255,255,.15);

}

@keyframes showPage{

to{

opacity:1;

}

}

h1{

font-size:52px;

margin-bottom:20px;

}

p{

font-size:22px;

margin-top:18px;

}

button{

margin-top:30px;

padding:15px 45px;

border:none;

border-radius:40px;

background:#ff5d91;

color:white;

font-size:20px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

background:#ff2e74;

}
.heart{
position:fixed;
bottom:-50px;
font-size:22px;
animation:floatUp 10s linear infinite;
opacity:.7;
pointer-events:none;
}

@keyframes floatUp{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

10%{
opacity:.8;
}

100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}

}
</style>

</head>

<body>

<div class="loading">

<h1>Loading...</h1>

<div class="bar">

<div class="progress"></div>

</div>

<p style="margin-top:30px;">Finding the cutest boyfriend... ❤️</p>

<p>Found him. 🥹</p>

</div>

<div class="container">

<h1>🌙 8 Years. 1 Heart. Infinite Love.</h1>

<p>Welcome, Handsome ❤️</p>

<p>I've been waiting for you...</p>

<button id="enter">✨ Enter</button>

</div>

<script>

document.getElementById("enter").onclick=function(){

document.querySelector(".container").innerHTML=`

<h1>❤️ Boyfriend Verification</h1>

<p>Before entering...</p>

<p>Please verify your identity.</p>

<br>

<input id="name" placeholder="What's your name?" style="padding:15px;width:80%;max-width:350px;border-radius:30px;border:none;font-size:18px;text-align:center;">

<br><br>

<button onclick="verify()">Verify ❤️</button>

`;

}

function verify(){

let n=document.getElementById("name").value.toLowerCase();

if(n=="anron"||n=="baby"){

document.querySelector(".container").innerHTML=`

<h1>Access Granted ❤️</h1>

<p>✅ Handsome</p>

<p>✅ Cute</p>

<p>✅ Mine</p>

<br>

<button onclick="loveQuiz()">Continue ❤️</button>

`;

}

else{

alert("Hmm... You're not my handsome. 🤨");

}

}

function loveQuiz(){

document.querySelector(".container").innerHTML=`

<h1>😂 Love Quiz</h1>

<p><b>Who loves more?</b></p>

<br>

<button onclick="answer()">❤️ Me</button>

<br><br>

<button onclick="answer()">🤍 You</button>

<br><br>

<button onclick="answer()">🤝 Both</button>

`;

}

function answer(){

document.querySelector(".container").innerHTML=`

<h1>🥹 Correct!</h1>

<p>The correct answer is...</p>

<h2 style="margin-top:20px;color:#ff9cc2;">❤️ YOU ❤️</h2>

<p>Because in my eyes...</p>

<p>You'll always be the right answer. ❤️</p>

<br>

<button onclick="choice()">Next ➜</button>

`;

}

function choice(){

document.querySelector(".container").innerHTML=`

<h1>⚽ One Question...</h1>

<p>You can only save ONE.</p>

<br>

<button onclick="result('me')">❤️ Me</button>

<br><br>

<button onclick="result('football')">⚽ Football</button>

<br><br>

<button onclick="result('kfc')">🍗 KFC</button>

`;

}

function result(x){

let msg="";

if(x=="me") msg="❤️ Correct choice. Relationship saved.";

if(x=="football") msg="😂 Wrong answer... but CR7 is watching.";

if(x=="kfc") msg="🍗 Really? Chicken over me? 😭";

document.querySelector(".container").innerHTML=`

<h1>${msg}</h1>

<p>P.S. I know you'd secretly try to save all three. ❤️</p>

<br>

<button onclick="dashboard()">Continue ➜</button>

`;

}

function dashboard(){

document.querySelector(".container").innerHTML=`

<h1>📊 Relationship Dashboard</h1>

<p>❤️ Together: <b>8 Years</b></p>

<p>📞 Phone Calls: <b>5000+</b></p>

<p>🎥 Video Calls: <b>1000+</b></p>

<p>😂 "You're Muted": <b>Too many to count</b></p>

<p>🌍 Distance: <b>India ➜ Ireland</b></p>

<p>💋 Kisses Pending: <b>∞</b></p>

<p>🤗 Hugs Pending: <b>Emergency Level</b></p>

<p>❤️ Love Level: <b>Infinite</b></p>

<br>

<button onclick="loveLetter()">Next ❤️</button>

`;

}

function loveLetter(){

document.querySelector(".container").innerHTML=`

<h1>💌 My Love...</h1>

<p>
Eight years ago, I never imagined that one person could become my favourite place, my biggest smile, and my safest feeling.
</p>

<p>
Thank you for every call, every laugh, every "I miss you", every smile, and every moment you've stayed by my side.
</p>

<p>
No matter how many miles separate us...
I'd still choose you every single time.
</p>

<p><b>Happy 8th Anniversary, Baby. ❤️</b></p>

<br>

<button onclick="finale()">One Last Surprise 🎁</button>

`;

}

function finale(){


document.querySelector(".container").innerHTML=`

<h1>🎉 Congratulations! 🎉</h1>

<h2>❤️ 8 Years. 1 Heart. Infinite Love. ❤️</h2>

<p>You successfully completed 8 years with the world's best girlfriend. 😌❤️</p>

<br>

<button onclick="resume()">📄 View Your Certificate</button>

`;

}

function resume(){

document.querySelector(".container").innerHTML=`

<h1 style="font-size:34px;">📜 Boyfriend Certificate</h1>

<p style="font-size:18px;">This Certificate is Proudly Presented To</p>

<h2 style="color:#ff9ac6;margin:15px 0;">❤️ Anron ❤️</h2>

<p>For Successfully Completing</p>

<h3 style="margin:15px 0;">8 Years of Loving Jenissa ❤️</h3>

<hr style="margin:25px 0;border:1px solid rgba(255,255,255,.25);">

<p>⭐ <b>Grade:</b> Infinity/10</p>

<p>🏆 <b>Award:</b> Lifetime Boyfriend License ❤️</p>

<p>⚽ Football Lover</p>

<p>🐐 Biggest CR7 Fan</p>

<p>🍗 KFC Expert</p>

<p>👟 White Shoes Approved</p>

<p>🧱 LEGO Kid Forever</p>

<hr style="margin:25px 0;border:1px solid rgba(255,255,255,.25);">

<p>Issued with Love by</p>

<h3 style="color:#ff9ac6;">❤️ Jenissa ❤️</h3>

<p>21 July 2026</p>

<br>

<button onclick="secret()">Accept Certificate ❤️</button>

`;

}

function secret(){

document.querySelector(".container").innerHTML=`

<h1>🤫 TOP SECRET</h1>

<h2>🚫 DON'T CLICK</h2>

<p>(Seriously... don't.)</p>

<br>

<button onclick="clicked()">I'M CLICKING 😏</button>

`;

}

function clicked(){

document.querySelector(".container").innerHTML=`

<h1>😂 I KNEW IT!</h1>

<p>You never listen.</p>

<p>Good...</p>

<p>Because if you hadn't clicked...</p>

<p>You would've missed this. ❤️</p>

<h2>I LOVE YOU SO MUCH, BABY 🥹❤️</h2>

<br>

<button onclick="heartGame()">Continue ❤️</button>

`;

}

function heartGame(){

document.querySelector(".container").innerHTML=`

<h1>❤️ Find My Heart ❤️</h1>

<p>Click the correct heart.</p>

<br>

<button onclick="wrongHeart()">💙</button>

<button onclick="wrongHeart()">💜</button>

<button onclick="correctHeart()">❤️</button>

<button onclick="wrongHeart()">🩷</button>

<button onclick="wrongHeart()">🧡</button>

`;

}

function wrongHeart(){

alert("Nope 😂 Try again!");

}

function correctHeart(){

document.querySelector(".container").innerHTML=`

<h1>❤️ You Found My Heart ❤️</h1>

<p>Actually...</p>

<p>You found it on</p>

<h2>21 July 2018 ❤️</h2>

<p>And you've kept it ever since. 🥹</p>

<br>

<button onclick="end()">Final Surprise 🎆</button>

`;

}

function end(){
celebrate();

document.querySelector(".container").innerHTML=`

<h1>🎆 Happy 8th Anniversary ❤️</h1>

<h2>My Baby,</h2>

<p>Eight years ago...</p>

<p>I found someone who became my biggest comfort, my favourite notification, and my safest place.</p>

<p>Thank you for every laugh, every late-night call, every "I miss you," and every memory we've created together.</p>

<p>No matter where life takes us...</p>

<h2>I'd still choose you.</h2>

<h2>Again.</h2>

<h2>Tomorrow.</h2>

<h2>Always. ❤️</h2>

<br>

<p><b>I love you.</b></p>

<h3>Forever Yours,</h3>

<h2>❤️ Jenissa ❤️</h2>

<hr style="margin:25px 0;border:1px solid rgba(255,255,255,.3);">

<h3>❤️ Lifetime Membership in Jenissa's Heart ❤️</h3>

<p>Status: ACTIVE ♾️</p>

<br>

<button onclick="lastMessage()">❤️ Close Website</button>

`;

window.scrollTo(0,0);

}
function lastMessage(){

document.querySelector(".container").innerHTML=`

<h1>🥹 Wait...</h1>

<p>Before you go...</p>

<p>I just wanted one last chance to tell you...</p>

<h2>I love you. ❤️</h2>

<p>Happy 8th Anniversary, Baby.</p>

<p>Thank you for choosing me every single day.</p>

<br>

<h2>See you soon. ❤️</h2>

<p>Now you may close the website... 😌</p>

`;

window.scrollTo(0,0);

}
setInterval(createHeart,800);

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*25)+"px";

heart.style.animationDuration=(6+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},11000);
function celebrate(){

for(let i=0;i<80;i++){

setTimeout(()=>{

const c=document.createElement("div");

c.innerHTML=["🎉","✨","❤️","💖"][Math.floor(Math.random()*4)];

c.style.position="fixed";

c.style.left=Math.random()*100+"vw";

c.style.top="-30px";

c.style.fontSize=(18+Math.random()*20)+"px";

c.style.transition="4s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.top="110vh";

},50);

setTimeout(()=>{

c.remove();

},4500);

},i*60);

}

}


</script>

</body>
</html>
